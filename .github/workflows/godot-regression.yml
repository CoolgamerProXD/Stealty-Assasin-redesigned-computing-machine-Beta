name: Godot 4.4.1 regression

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install official Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          echo 'ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  '"$RUNNER_TEMP"'/godot.zip' | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --version | tee "$RUNNER_TEMP/version.log"
          { uname -a; grep -m1 'model name' /proc/cpuinfo; grep -m1 MemTotal /proc/meminfo; nproc; } > "$RUNNER_TEMP/environment.log"
      - name: Data checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Start main scene
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'Headless 120-frame run: elapsed %e s; peak RSS %M KiB' timeout 90 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/startup.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/startup.log"; then exit 1; fi
      - name: Behavioral regression suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --script res://tests/run_tests.gd 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^FAIL:' "$RUNNER_TEMP/tests.log"; then exit 1; fi
          grep -E '^RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/tests.log"
      - name: Automated camera and virtual-display sampling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a --server-args="-screen 0 1280x720x24" /usr/bin/time -f 'Virtual-display run: elapsed %e s; peak RSS %M KiB' timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/camera_display_test.gd 2>&1 | tee "$RUNNER_TEMP/camera.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^CAMERA FAIL:' "$RUNNER_TEMP/camera.log"; then exit 1; fi
          grep -E '^CAMERA RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/camera.log"
      - name: Through-wall rendered image regression
        shell: bash
        run: |
          set -euo pipefail
          TEST_SCREENSHOT_DIR="$GITHUB_WORKSPACE/visual-test-output" xvfb-run -a --server-args="-screen 0 1280x720x24" timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/instinct_render_test.gd 2>&1 | tee "$RUNNER_TEMP/visual.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^VISUAL FAIL:' "$RUNNER_TEMP/visual.log"; then exit 1; fi
          grep -E '^VISUAL RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/visual.log"
      - name: Cinematic scene and UI captures
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/cinema_capture_test.gd 2>&1 | tee "$RUNNER_TEMP/cinema.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^CINEMA FAIL:' "$RUNNER_TEMP/cinema.log"; then exit 1; fi
          grep -E '^CINEMA RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/cinema.log"
      - name: Upload rendered comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instinct-rendered-comparisons
          path: visual-test-output/*.png
          if-no-files-found: ignore
      # Expose short diagnostics through the GitHub checks API; some environments
      # cannot reach the separate Actions log-download host.
      - name: Report diagnostic excerpts
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          # Emit compact, separate notices before detailed excerpts: checks API
          # limits the number/size of annotations returned by some clients.
          for name in ("version", "environment", "import", "startup", "tests", "camera", "visual", "cinema"):
              path = root / (name + ".log")
              if not path.exists():
                  continue
              lines = path.read_text(errors="replace").splitlines()
              if name in ("tests", "camera", "visual", "cinema"):
                  selected = [line for line in lines if re.search(r"^RESULT:|^CAMERA RESULT:|^VISUAL RESULT:|^VISUAL_METRIC:|^VISUAL FAIL:|^CINEMA RESULT:|^CINEMA_METRIC:|^PRESET_METRIC:|^STATION_SAMPLE:|^WING_DIAG:|^CINEMA FAIL:|^DISPLAY_METRIC:|^DISPLAY_STARTUP:|^FAIL:|^CAMERA FAIL:|SCRIPT ERROR|ERROR:|^STEALTH_DIAG:|^EQUIP_DIAG:|^CAMERA_DIAG:", line)]
              elif name in ("import", "startup"):
                  selected = [line for line in lines if re.search(r"Godot Engine|SCRIPT ERROR|ERROR:|Headless 120", line)]
              else:
                  selected = lines
              text = "\n".join(selected)[-3500:] or "No matching diagnostics."
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title={name} summary::{text}")
          PYCODE
      # Separate step: GitHub limits the number of notices in a single step.
      - name: Preview wall comparison thumbnails
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, pathlib
          for path in sorted(pathlib.Path("visual-test-output").glob("*_wall_on_thumb.jpg")):
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for index in range(0, len(encoded), 3000):
                  print(f"::notice title=preview_{path.stem}_{index // 3000}::{encoded[index:index + 3000]}")
          PYCODE
      - name: Preview physical target thumbnails
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, pathlib
          for path in sorted(pathlib.Path("visual-test-output").glob("*_target_open_thumb.jpg")):
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for index in range(0, len(encoded), 3000):
                  print(f"::notice title=preview_{path.stem}_{index // 3000}::{encoded[index:index + 3000]}")
          PYCODE
      - name: Preview environment captures
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, pathlib
          for name in ("cinema_hotel_lobby", "cinema_initiation"):
              path = pathlib.Path("visual-test-output") / (name + "_thumb.jpg")
              if not path.exists(): continue
              data = base64.b64encode(path.read_bytes()).decode("ascii")
              for i in range(0, len(data), 3000): print(f"::notice title=preview_{name}_{i // 3000}::{data[i:i+3000]}")
          PYCODE
      - name: Preview gameplay captures
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, pathlib
          for name in ("cinema_hotel_corridor", "cinema_weapon_aim", "cinema_tung_chung"):
              path = pathlib.Path("visual-test-output") / (name + "_thumb.jpg")
              if not path.exists(): continue
              data = base64.b64encode(path.read_bytes()).decode("ascii")
              for i in range(0, len(data), 3000): print(f"::notice title=preview_{name}_{i // 3000}::{data[i:i+3000]}")
          PYCODE


      - name: Preview new environments
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, pathlib
          for name in ("cinema_hotel_wing", "cinema_hotel_upper", "cinema_hotel_intel", "cinema_city", "cinema_ngong_ping"):
              path = pathlib.Path("visual-test-output") / (name + "_thumb.jpg")
              if not path.exists(): continue
              data = base64.b64encode(path.read_bytes()).decode("ascii")
              for i in range(0, len(data), 3000): print(f"::notice title=preview_{name}_{i // 3000}::{data[i:i+3000]}")
          PYCODE

  windows:
    if: contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download and verify official Godot and export template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable'
          $engine = 'Godot_v4.4.1-stable_win64.exe.zip'
          $templates = 'Godot_v4.4.1-stable_export_templates.tpz'
          foreach ($file in @('SHA512-SUMS.txt', $engine, $templates)) {
            & curl.exe --fail --location --retry 3 --output "$env:RUNNER_TEMP\$file" "$base/$file"
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $file" }
          }
          foreach ($file in @($engine, $templates)) {
            $line = Get-Content "$env:RUNNER_TEMP\SHA512-SUMS.txt" | Where-Object { $_.Contains($file) } | Select-Object -First 1
            if (!$line) { throw "No official hash found for $file" }
            $expected = ($line -split '\s+')[0]
            $actual = (Get-FileHash "$env:RUNNER_TEMP\$file" -Algorithm SHA512).Hash
            if ($actual -ne $expected) { throw "SHA512 mismatch: $file" }
          }
          Expand-Archive "$env:RUNNER_TEMP\$engine" "$env:RUNNER_TEMP\godot"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $destination = Join-Path $env:APPDATA 'Godot\export_templates\4.4.1.stable'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP\$templates")
          try {
            $entry = $archive.GetEntry('templates/windows_release_x86_64.exe')
            if (!$entry) { throw 'Windows release template missing' }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $destination 'windows_release_x86_64.exe'), $true)
          } finally { $archive.Dispose() }
      - name: Import and export
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = "$env:RUNNER_TEMP\godot\Godot_v4.4.1-stable_win64_console.exe"
          & $godot --version
          & $godot --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw 'Import failed' }
          New-Item -ItemType Directory -Force 'build/windows' | Out-Null
          & $godot --headless --path . --export-release Windows "$env:GITHUB_WORKSPACE\build\windows\PROJECT_ASSASSIN.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Export failed' }
      - name: Launch exported build headlessly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = "$env:GITHUB_WORKSPACE\build\windows"
          $process = Start-Process "$path\PROJECT_ASSASSIN.exe" -WorkingDirectory $path -ArgumentList @('--headless', '--quit-after', '120', '--log-file', "$path\smoke.log") -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw 'Exported build timed out' }
          if ($process.ExitCode -ne 0) { throw "Exported build exited $($process.ExitCode)" }
          if (!(Test-Path "$path\smoke.log")) { throw 'No smoke log produced' }
          Get-Content "$path\smoke.log"
          if (Select-String -Path "$path\smoke.log" -Pattern 'SCRIPT ERROR|ERROR:') { throw 'Exported build logged errors' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-assassin-windows-smoke-tested
          path: build/windows/*
          if-no-files-found: error
